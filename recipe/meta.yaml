{% set name = "fsleyes-plugin-mrs" %}
{% set version = "0.1.13" %}
{% set pyproject = load_file_data("../pyproject.toml") %}
{% set deps = pyproject["project"]["dependencies"] %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 5671bb5eb1f51550fde95b902fc6707e6a0965ec31d2e3535701c7c8c704b676

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    {% for package in deps %}
    {% if package.startswith("matplotlib") %}
    - {{ package.replace("matplotlib", "matplotlib-base", 1) }}
    {% else %}
    - {{ package }}
    {% endif %}
    {% endfor %}

test:
  requires:
    - python {{ python_min }}
  imports:
    - fsleyes_plugin_mrs

about:
  home: https://git.fmrib.ox.ac.uk/wclarke/fsleyes-plugin-mrs
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: An FSLeyes extension for viewing MRS(I) data formatted as NIfTI-MRS.
  # The remaining entries in this section are optional, but recommended.
  description: |
    This plugin adds an additional MRS specific view panel to FSLeyes which displays spectra in the frequency domain. Higher dimensions of data stored in NIfTI-MRS format may be explored.
  dev_url: https://git.fmrib.ox.ac.uk/wclarke/fsleyes-plugin-mrs

extra:
  recipe-maintainers:
    - vkarlaftis
    - wtclarke
